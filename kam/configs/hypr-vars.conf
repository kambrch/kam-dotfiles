# Hyprland user variable definitions
# These are sourced BEFORE Caelestia defaults to allow variable substitution.
# Sourced by install.sh and Caelestia's hypr setup.

input {
  kb_layout = pl
  kb_variant =
  kb_options =
}

misc {
  focus_on_activate = false
  swallow_regex = (foot|kitty|alacritty|Alacritty)
}

xwayland {
  force_zero_scaling = true
}

# Environment variable overrides (from custom/env.conf)
env = EDITOR, nvim
