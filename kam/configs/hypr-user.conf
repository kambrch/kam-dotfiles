# Consolidated Hyprland user overrides from ii custom/ layer
# This monolithic file replaces the multi-file custom/ structure for Caelestia.
# Sourced AFTER Caelestia defaults; may override or supplement default binds/rules/execs.

# === Keybinds (from ii custom/keybinds.conf) ===

##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Override defaults from hyprland/keybinds.conf in one place.
unbind = Super, C
unbind = Super, W
unbind = Super, Q
unbind = Super, D
unbind = Super, P
unbind = Super, A
unbind = , Print
unbind = Ctrl, Print
unbind = Super+Shift, S

##! Apps
# Custom shortcuts
bind = Super, C, killactive # Kill active window/process
bind = Super, W, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium" "microsoft-edge-stable" "opera" "librewolf" # Browser
bind = Super, R, exec, fuzzel # System search / launcher
bind = Super, P, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "command -v nvim && kitty -1 nvim" "command -v nvim && alacritty -e nvim" "command -v nvim && foot -e nvim" # Text editor (neovim)
bind = Super, Q, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm" # Terminal
bind = Super, D, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "dolphin" "nautilus" "nemo" "thunar" "${TERMINAL}" "kitty -1 fish -c yazi" # File manager
bind = Super, A, exec, ~/.config/hypr/custom/scripts/ocr-region.sh # OCR selected region >> clipboard
bind = Super, Z, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "kitty -1 zellij" "foot -e zellij" "alacritty -e zellij" "wezterm start zellij" "konsole -e zellij" "kgx -e zellij" "uxterm -e zellij" "xterm -e zellij" # Terminal multiplexer (zellij)

##! Screenshots (Grim/Slurp/Swappy)
# Pipeline:
# 1) grim captures (region via slurp or full output)
# 2) swappy opens for annotation
# 3) final annotated image is copied to clipboard
bindl = ,Print, exec, ~/.config/hypr/custom/scripts/swappy-capture.sh region # Region screenshot + annotation
bindl = Ctrl, Print, exec, ~/.config/hypr/custom/scripts/swappy-capture.sh full # Fullscreen screenshot + annotation
bind = Super+Shift, S, exec, ~/.config/hypr/custom/scripts/swappy-capture.sh full # Fullscreen screenshot + annotation

# === Execs (from ii custom/execs.conf) ===

# Session env fix for user services (kept in `custom` on purpose; do not edit base `hyprland/execs.conf`)
# Base config may contain similar dbus env updates; duplication is accepted to keep upstream files untouched.

exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# exec-once = systemctl --user restart ssh-add.service

# Input method
# exec-once = fcitx5

# Stability: do not auto-spawn Quickshell from here.
# Default startup already launches Quickshell in `hyprland/execs.conf`.
# Keeping a second launcher here can race and create duplicate shell instances.
# exec = pgrep -x qs >/dev/null || qs -c ii &

# Apply monitor layout dynamically based on currently detected outputs.
exec-once = sleep 1 && bash ~/.config/hypr/custom/scripts/apply-monitor-layout.sh

# Example custom execs (uncomment to enable):
exec-once = nm-applet &        # Network manager applet
exec-once = blueman-applet &   # Bluetooth manager applet
exec-once = pasystray &        # PulseAudio tray indicator
exec-once = udiskie -t &       # Auto-mount external drives
exec-once = keepassxc &        # Password manager (minimized to tray)

# === Window Rules (from ii custom/rules.conf) ===

# Swappy editor: float for quick annotate/save workflow
windowrule = match:class ^(swappy|Swappy)$, float on

# === Monitors (from ii custom/monitors.conf) ===

# Safety fallback for monitor bring-up.
# Applies to any detected output that does not have a specific rule.
# (Already defined in hyprland/general.conf — no need to duplicate here.)
# monitor=,preferred,auto,1
